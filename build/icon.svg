<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 简影投屏 - 极简图标设计 -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- 核心图形：简化的投影屏幕 -->
  <rect x="80" y="80" width="352" height="352" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- 内部投影区域 -->
  <rect x="104" y="104" width="304" height="304" fill="#323341"/>

  <!-- 极简的"简"字图形化 - 三条横线表示简洁 -->
  <rect x="168" y="200" width="176" height="24" fill="#ffffff"/>
  <rect x="192" y="248" width="128" height="16" fill="#cccccc"/>
  <rect x="216" y="288" width="80" height="16" fill="#999999"/>

  <!-- 极简的投影光线 - 几何线条表示"影" -->
  <line x1="176" y1="408" x2="152" y2="472" stroke="#000000" stroke-width="4"/>
  <line x1="256" y1="408" x2="256" y2="472" stroke="#000000" stroke-width="4"/>
  <line x1="336" y1="408" x2="360" y2="472" stroke="#000000" stroke-width="4"/>
</svg>
