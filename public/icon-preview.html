<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Preview</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #e8e8ea; padding: 40px; text-align: center; }
  h2 { font-weight: 300; letter-spacing: 2px; margin-bottom: 32px; }
  .sizes { display: flex; gap: 32px; justify-content: center; align-items: flex-end; flex-wrap: wrap; }
  .size-card { text-align: center; }
  .size-card p { font-size: 11px; color: #888; margin-top: 8px; }
  img { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
  .bg-dark { background: #1a1a2e; border-radius: 20px; padding: 24px; display: inline-block; }
  .bg-light { background: #fff; border-radius: 20px; padding: 24px; display: inline-block; }
</style>
</head>
<body>
<h2>简影投屏 — 新图标预览</h2>
<div class="sizes">
  <div class="size-card">
    <img src="icon-512.png" width="256" height="256">
    <p>App Store / 256px</p>
  </div>
  <div class="size-card">
    <img src="icon-512.png" width="128" height="128">
    <p>Finder / 128px</p>
  </div>
  <div class="size-card">
    <img src="icon-512.png" width="64" height="64">
    <p>Dock / 64px</p>
  </div>
  <div class="size-card">
    <img src="icon-512.png" width="32" height="32">
    <p>菜单栏 / 32px</p>
  </div>
  <div class="size-card">
    <img src="icon-512.png" width="16" height="16">
    <p>通知 / 16px</p>
  </div>
</div>
<p style="margin-top:32px;font-size:12px;color:#888;">
浅色背景 · 深海蓝几何符号 · 左侧细竖条 + 右侧膨胀形体 · 上下横条连接<br>
无文字 · 无彩光 · 极简科技品牌风格
</p>
</body>
</html>
